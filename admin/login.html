<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Savings</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/login.css">
  <link rel="stylesheet" href="../css/toast.css">
</head>
<body>

  <div class="auth-page-wrapper" style="min-height: 100vh;">
    <div class="auth-container">
      <div style="text-align:center; margin-bottom: 1.5rem;">
        <div style="font-size:1.4rem; font-weight:700; color: var(--color-dark);">Savings</div>
        <div style="font-size:0.8rem; font-weight:600; letter-spacing:0.08em; color: var(--color-primary); margin-top:2px;">ADMIN PANEL</div>
      </div>

      <form class="auth-form" id="admin-login-form">
        <div class="form-group">
          <label for="admin-email">Admin Email</label>
          <input type="email" id="admin-email" name="email" required autocomplete="username">
        </div>

        <div class="form-group">
          <label for="admin-password">Password</label>
          <input type="password" id="admin-password" name="password" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn-primary">Log In</button>
      </form>

      <p style="text-align:center; margin-top:1.25rem;">
        <a href="../index.html" style="color: var(--color-text-muted); font-size:0.85rem; text-decoration:none;">&larr; Back to site</a>
      </p>
    </div>
  </div>

  <script src="../js/toast.js"></script>
  <script src="js/admin-login.js"></script>
</body>
</html>
