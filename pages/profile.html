<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - Savings</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/nav.css">
  <link rel="stylesheet" href="../css/toast.css">
  <link rel="stylesheet" href="../css/profile.css">
</head>
<body>

  <nav class="navbar">
    <div class="logo">Savings</div>
    <ul class="nav-links">
      <li><a href="../index.html">Home</a></li>
      <li><a href="card-selection.html">Card Perks</a></li>
      <li><a href="benefits.html">Deals & Offers</a></li>
      <li><a href="financial-education.html">Financial Education</a></li>
      <li id="nav-auth-item"><a href="login.html" class="btn-login">Login</a></li>
    </ul>
  </nav>

  <div class="page-container">
    <a href="dashboard.html" class="back-link">&larr; Back to Dashboard</a>
    <h1>Profile Settings</h1>

    <section class="settings-section">
      <h3>Personal Information</h3>
      <form id="info-form">
        <div class="form-group">
          <label for="profile-name">Full Name</label>
          <input type="text" id="profile-name" required>
        </div>
        <div class="form-group">
          <label for="profile-email">Email</label>
          <input type="email" id="profile-email" required>
        </div>
        <button type="submit" class="btn-primary">Save Changes</button>
      </form>
    </section>

    <section class="settings-section">
      <h3>Change Password</h3>
      <form id="password-form">
        <div class="form-group">
          <label for="current-password">Current Password</label>
          <input type="password" id="current-password" required>
        </div>
        <div class="form-group">
          <label for="new-password">New Password</label>
          <input type="password" id="new-password" required>
        </div>
        <button type="submit" class="btn-primary">Update Password</button>
      </form>
    </section>
  </div>

  <script src="../js/toast.js"></script>
  <script>const NAV_BASE = '';</script>
  <script src="../js/nav-auth.js"></script>
  <script src="../js/profile.js"></script>
</body>
</html>
