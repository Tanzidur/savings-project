<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Selection - Savings</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/card-selection.css">
</head>
<body>

  <div class="page-container">
    <h1>Select Your Bank & Card</h1>

    <section>
      <h3>Step 1: Choose a Bank</h3>
      <div class="bank-list" id="bank-list">
        <p class="loading-msg">Loading banks...</p>
      </div>
    </section>

    <section>
      <h3>Step 2: Choose a Card</h3>
      <div class="card-list" id="card-list">
        <p class="placeholder-msg">Select a bank above to see its cards.</p>
      </div>
    </section>

    <section>
      <h3>Card Benefits</h3>
      <div class="benefits-box" id="benefits-box">
        <p class="placeholder-msg">Select a card above to view its benefits.</p>
      </div>
    </section>
  </div>

  <script src="../js/card-selection.js"></script>
</body>
</html>
