<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Perks - Savings</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/nav.css">
  <link rel="stylesheet" href="../css/card-selection.css">
</head>
<body>

  <nav class="navbar">
    <div class="logo">Savings</div>
    <ul class="nav-links">
      <li><a href="../index.html">Home</a></li>
      <li><a href="card-selection.html">Card Perks</a></li>
      <li><a href="benefits.html">Deals & Offers</a></li>
      <li><a href="financial-education.html">Financial Education</a></li>
      <li id="nav-auth-item"><a href="login.html" class="btn-login">Login</a></li>
    </ul>
  </nav>

  <div class="page-container">
    <h1>Card Perks</h1>

    <section>
      <h3>Step 1: Choose a Bank</h3>
      <div class="bank-list" id="bank-list">
        <p class="loading-msg">Loading banks...</p>
      </div>
    </section>

    <section id="card-section" class="hidden">
      <h3>Step 2: Choose a Card</h3>

      <div class="filter-bar" id="type-filter-bar">
        <button class="filter-btn active" data-filter="All">All</button>
        <button class="filter-btn" data-filter="Debit">Debit</button>
        <button class="filter-btn" data-filter="Credit">Credit</button>
      </div>

      <div class="card-grid" id="card-grid"></div>
    </section>

    <section id="benefits-section" class="hidden">
      <h3>Card Benefits</h3>
      <div class="benefits-box" id="benefits-box"></div>
      <button id="save-card-btn" class="btn-primary" style="margin-top: 1rem;">Save This Card to My Account</button>
      <p class="status-msg" id="save-card-status"></p>
    </section>
  </div>

  <script>const NAV_BASE = '';</script>
  <script src="../js/nav-auth.js"></script>
  <script src="../js/card-selection.js"></script>
</body>
</html>
