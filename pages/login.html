<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Register - Savings</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/login.css">
</head>
<body>

  <div class="auth-container">
    <div class="auth-tabs">
      <button class="tab-btn active" id="login-tab">Login</button>
      <button class="tab-btn" id="register-tab">Register</button>
    </div>

    <form class="auth-form" id="login-form">
      <div class="form-group">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" name="email" required>
      </div>

      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" name="password" required>
      </div>

      <button type="submit" class="btn-primary">Log In</button>
    </form>

    <form class="auth-form hidden" id="register-form">
      <div class="form-group">
        <label for="register-name">Full Name</label>
        <input type="text" id="register-name" name="name" required>
      </div>

      <div class="form-group">
        <label for="register-email">Email</label>
        <input type="email" id="register-email" name="email" required>
      </div>

      <div class="form-group">
        <label for="register-password">Password</label>
        <input type="password" id="register-password" name="password" required>
      </div>

      <div class="form-group">
        <label for="register-confirm">Confirm Password</label>
        <input type="password" id="register-confirm" name="confirm" required>
      </div>

      <button type="submit" class="btn-primary">Create Account</button>
    </form>
  </div>

  <script src="../js/login.js"></script>
</body>
</html>
